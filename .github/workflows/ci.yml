name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  clasp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clasp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clasp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:run

  browser:
    # Keep the host supported by the locked Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        id: browser_build
      # Both suites own port 1111; keep these steps sequential.
      - name: Mock Mode browser workflows
        run: npm run test:e2e
      - name: Intercepted Connection browser workflows
        if: ${{ !cancelled() && steps.browser_build.outcome == 'success' }}
        run: npm run test:e2e:connection
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:run

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Integration suite needs a live GAS deployment URL + secret — not run in CI.
